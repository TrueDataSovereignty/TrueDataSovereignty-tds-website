<!doctype html><meta charset="utf-8"><title>phone frame for screenshots</title>
<style>html,body{margin:0;background:#000;overflow:hidden}iframe{border:0;display:block;width:390px}</style>
<iframe id="f"></iframe>
<script>var q=new URLSearchParams(location.search),f=document.getElementById('f');f.style.height=(q.get('h')||844)+'px';f.style.width=(q.get('w')||390)+'px';f.src=q.get('u');
f.onload=function(){var y=+q.get('y')||0;if(y)f.contentWindow.scrollTo(0,y);};</script>
